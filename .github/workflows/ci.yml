name: Website checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:threads
      - run: npm run test:threads:http
      - run: npm run test:research
      - run: npm run build
      - name: Verify static export and runner account edition, group and revision
        run: npm run check:export
      - run: npm run test:http
      - name: Check production SEO output with test values
        env:
          SITE_INDEXABLE: "true"
          NEXT_PUBLIC_SITE_URL: https://nxtgo.example
          SITE_OPERATOR_NAME: NXTGO CI fixture
          SITE_CONTACT_EMAIL: seo@example.test
        run: |
          npm run build
          npm run check:export
      - name: Measure mobile performance with Lighthouse
        timeout-minutes: 3
        run: |
          npx --yes --package=@lhci/cli@0.16.1 lhci collect \
            --staticDistDir=out --numberOfRuns=1 --settings.onlyCategories=performance \
            --settings.hostname=127.0.0.1 \
            --url=http://127.0.0.1/ \
            --url=http://127.0.0.1/races/ \
            --url=http://127.0.0.1/races/2027/schkm-youth-2027/
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { readdirSync, readFileSync } from "node:fs";
          const files = readdirSync(".lighthouseci").filter((name) => /^lhr-.*\.json$/.test(name));
          if (files.length !== 3) throw new Error(`Expected three Lighthouse reports, received ${files.length}`);
          console.log("| Page | Mobile performance | Largest Contentful Paint |");
          console.log("| --- | ---: | ---: |");
          for (const file of files) {
            const report = JSON.parse(readFileSync(`.lighthouseci/${file}`, "utf8"));
            if (report.categories.performance.score === null) throw new Error(`Missing performance score for ${report.requestedUrl}`);
            const score = Math.round(report.categories.performance.score * 100);
            const lcp = report.audits["largest-contentful-paint"].displayValue;
            console.log(`| ${new URL(report.requestedUrl).pathname} | ${score} | ${lcp} |`);
          }
          JS
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install security scanners
        id: install-security
        run: |
          tools="$RUNNER_TEMP/security-tools"
          mkdir -p "$tools"
          cd "$tools"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64 \
            --output osv-scanner
          sha256sum --check <<'SHA256'
          551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz
          fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner
          SHA256
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x osv-scanner
          python3 -m venv python
          python/bin/python -m pip --disable-pip-version-check install semgrep==1.186.0 zizmor==1.32.0
      - name: Scan commits for secrets
        run: |
          log_options=--diff-merges=first-parent
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            log_options+=" $BASE_SHA..HEAD"
          fi
          "$RUNNER_TEMP/security-tools/gitleaks" git --redact=100 --no-banner --log-opts="$log_options" .
      - name: Scan source code with Semgrep
        if: ${{ !cancelled() && steps.install-security.outcome == 'success' }}
        run: |
          baseline=()
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            baseline=(--baseline-commit "$BASE_SHA")
          fi
          "$RUNNER_TEMP/security-tools/python/bin/semgrep" scan --config=p/default \
            --metrics=off --disable-version-check --error "${baseline[@]}" src scripts
      - name: Scan npm dependencies with OSV-Scanner
        if: ${{ !cancelled() && steps.install-security.outcome == 'success' }}
        run: '"$RUNNER_TEMP/security-tools/osv-scanner" scan source --lockfile=package-lock.json'
      - name: Audit GitHub Actions with zizmor
        if: ${{ !cancelled() && steps.install-security.outcome == 'success' }}
        run: '"$RUNNER_TEMP/security-tools/python/bin/zizmor" --offline .github/workflows'
